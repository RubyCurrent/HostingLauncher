name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Restore original sources
        run: |
          git fetch --depth=1 https://github.com/AngelAuraMC/Amethyst-Android.git v3_openjdk
          rm -rf app_pojavlauncher/src
          git checkout FETCH_HEAD -- app_pojavlauncher/src

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Rename to Cost Launcher
        run: |
          sed -i 's|"Amethyst (Debug)"|"Cost Launcher"|g; s|"Amethyst"|"Cost Launcher"|g' app_pojavlauncher/build.gradle
          sed -i -E "s|(applicationId[ =]+)[\"'][^\"']*[\"']|\1\"com.costlite.launcher\"|" app_pojavlauncher/build.gradle
          sed -i -E 's|(name="app_name"[^>]*>)[^<]*<|\1Cost Launcher<|; s|(name="app_short_name"[^>]*>)[^<]*<|\1Cost Launcher<|' app_pojavlauncher/src/main/res/values/strings.xml app_pojavlauncher/src/main/res/values-ru/strings.xml
          grep -n "Cost Launcher" app_pojavlauncher/build.gradle app_pojavlauncher/src/main/res/values/strings.xml
          grep -n "applicationId" app_pojavlauncher/build.gradle

      - name: Emerald black theme
        run: |
          pip install pillow numpy
          python3 - <<'EOF'
          import re, glob, os, colorsys
          import numpy as np
          from PIL import Image

          def recolor_rgb(r, g, b):
              r, g, b = r / 255, g / 255, b / 255
              hh, l, s = colorsys.rgb_to_hls(r, g, b)
              if s > 0.15 and 0.68 <= hh <= 0.95:
                  r, g, b = colorsys.hls_to_rgb(160 / 360, l, s)
                  return round(r * 255), round(g * 255), round(b * 255)
              return None

          def xml_shift(m):
              h = m.group(1)
              a, rgb = (h[:2], h[2:]) if len(h) == 8 else ('', h)
              res = recolor_rgb(*[int(rgb[i:i+2], 16) for i in (0, 2, 4)])
              if res:
                  return '#' + a + '%02X%02X%02X' % res
              return m.group(0)

          def java_shift(m):
              h = m.group(2)
              res = recolor_rgb(*[int(h[i:i+2], 16) for i in (2, 4, 6)])
              if res:
                  return m.group(1) + h[:2] + '%02X%02X%02X' % res
              return m.group(0)

          base = 'app_pojavlauncher/src/main/'
          for f in glob.glob(base + 'res/**/*.xml', recursive=True):
              t = open(f, encoding='utf-8').read()
              n = re.sub(r'#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6})\b', xml_shift, t)
              if n != t:
                  open(f, 'w', encoding='utf-8').write(n)
                  print('xml', f)

          for f in glob.glob(base + 'java/**/*.java', recursive=True):
              t = open(f, encoding='utf-8').read()
              n = re.sub(r'(0x)([0-9A-Fa-f]{8})\b', java_shift, t)
              if n != t:
                  open(f, 'w', encoding='utf-8').write(n)
                  print('java', f)

          for f in glob.glob(base + 'res/**/*', recursive=True):
              if 'mipmap' in os.path.dirname(f) or not f.lower().endswith(('.png', '.webp')):
                  continue
              try:
                  im = Image.open(f).convert('RGBA')
                  alpha = im.getchannel('A')
                  hsv = np.array(im.convert('RGB').convert('HSV'))
                  mask = (hsv[..., 0] >= 173) & (hsv[..., 0] <= 240) & (hsv[..., 1] > 38)
                  if mask.any():
                      hsv[..., 0][mask] = 113
                      out = Image.fromarray(hsv, 'HSV').convert('RGB')
                      out.putalpha(alpha)
                      if f.lower().endswith('.webp'):
                          out.save(f, 'WEBP', lossless=True)
                      else:
                          out.save(f)
                      print('img', f)
              except Exception as e:
                  print('skip', f, e)
          EOF

      - name: Replace launcher icon
        run: |
          RES=app_pojavlauncher/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dpi s fg <<< "$d"
            convert icon.png -resize ${s}x${s} $RES/mipmap-$dpi/ic_launcher.webp
            convert icon.png -resize ${s}x${s} $RES/mipmap-$dpi/ic_launcher_round.webp
            convert icon.png -resize ${fg}x${fg} $RES/mipmap-$dpi/ic_launcher_foreground.webp
            convert -size ${fg}x${fg} xc:'#000000' $RES/mipmap-$dpi/ic_launcher_background.webp
          done

      - name: Report leftover purple colors
        run: |
          grep -rniE "#[0-9a-f]{0,2}(7b1fa2|6200ee|bb86fc|9c27b0|8e24aa|6a1b9a|822ca8|7e57c2|673ab7)" app_pojavlauncher/src/main/res | head -40 || true
          cat app_pojavlauncher/src/main/res/values/colors.xml | head -60 || true

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*
